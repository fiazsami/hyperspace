# Builds and runs this submodule's test suite on every pull request.
#
# This is a smoke test, NOT the coverage gate. The gate lives in the
# screen-savers superproject -- tools/coverage.sh plus coverage/<name>.json --
# and cannot run here: the superproject is private, and it is where the source
# list, the include paths and the ratchet baseline live. A PR in this repo
# therefore cannot tell you whether coverage held. It can tell you the suite
# still compiles and still passes, which is the part a reviewer of this repo
# would otherwise have no way to check at all.
#
# The build recipe below duplicates a little of that config by necessity. If the
# two ever disagree, coverage/<name>.json in the superproject is the authority
# and this file is the thing that is wrong.
#
# The job is named "tests" because that string is the check context required by
# branch protection on master. Renaming the job silently disables the gate.

name: tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run the test suite
        run: |
          set -euo pipefail
          OUT=.ci-build
          rm -rf "$OUT"; mkdir -p "$OUT"
          INC=(-I. -Itests)
          SOURCES=()
          for dir in rsMath Implicit Rgbhsl util tests; do
            while IFS= read -r f; do SOURCES+=("$f"); done < <(find "$dir" -type f \( -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" -o -name "*.c" -o -name "*.m" -o -name "*.mm" \) | sort)
          done
          [ ${#SOURCES[@]} -gt 0 ] || { echo "no sources found" >&2; exit 1; }
          n=0
          for src in "${SOURCES[@]}"; do
            n=$((n + 1))
            case "$src" in
              *.m)  xcrun clang   -x objective-c              "${INC[@]}" -c "$src" -o "$OUT/$n.o" ;;
              *.mm) xcrun clang++ -x objective-c++ -std=c++17 "${INC[@]}" -c "$src" -o "$OUT/$n.o" ;;
              *.c)  xcrun clang                               "${INC[@]}" -c "$src" -o "$OUT/$n.o" ;;
              *)    xcrun clang++ -std=c++17                  "${INC[@]}" -c "$src" -o "$OUT/$n.o" ;;
            esac
          done
          xcrun clang++ "$OUT"/*.o -framework OpenGL -o "$OUT/tests"
          "$OUT/tests"

      # The suite above compiles with clang and never opens the Xcode project, so
      # until this step existed a completely broken Release build stayed green.
      # That is not hypothetical: every target once failed on the removed
      # libarclite and it went unnoticed through the whole of phase 1, because
      # nothing in CI had ever built a screen saver. Phase 2 touches the project
      # on every commit, so the gap mattered more from here on.
      #
      # Deliberately passes no signing overrides. The project signs ad-hoc, and a
      # runner has no certificate -- so a green run here is the evidence that the
      # committed settings build for someone who is not the author.
      #
      # Both configurations. Debug carries the same signing keys and is the first
      # build a new contributor runs, so leaving it unbuilt would put the half of
      # the change with no prior art in the half with no test.
      #
      # Building is not enough on its own, which review caught: the distinction
      # this project argues for -- explicit "-" seals the bundle, an emptied key
      # yields an unsealed linker-signed one -- produces ** BUILD SUCCEEDED **
      # either way. Only the signature tells them apart, so assert it.
      - name: Build and verify the saver
        run: |
          set -euo pipefail

          # A team ID in the project file, in either spelling. DEVELOPMENT_TEAM is
          # the build setting; DevelopmentTeam is what Xcode writes under
          # TargetAttributes -- and this repo shipped one there, which a grep for
          # the first spelling missed entirely while every other check passed.
          # Only "" is permitted.
          #
          # This lives here as well as in the superproject's commit hook because
          # the two catch different things: the hook sees commits made through
          # that harness, CI sees whatever actually arrives on a branch.
          if grep -nE '(DEVELOPMENT_TEAM|DevelopmentTeam)[[:space:]]*=' \
               Hyperspace.xcodeproj/project.pbxproj | grep -vE '=[[:space:]]*"";'; then
            echo "::error::project.pbxproj carries a non-empty development team (shown above)"
            exit 1
          fi

          verify() {
            echo "verifying $1"
            # Catches the regression this project's signing argument is about:
            # an emptied CODE_SIGN_IDENTITY still prints ** BUILD SUCCEEDED **
            # but leaves the bundle unsealed and linker-signed. Verified by
            # building it both ways -- only this call tells them apart.
            codesign --verify --strict --verbose=4 "$1"
            # No pipeline. Under pipefail, a grep -q that exits on its first
            # match can SIGPIPE whatever is writing to it; 141 then propagates
            # as the pipeline's status, the || branch runs, and CI reports a
            # signing regression on a perfectly good bundle.
            #
            # An earlier version of this fix captured codesign's output and then
            # piped it into grep anyway, which is the same pipeline with a
            # different writer -- review pointed out it fixed nothing. A here
            # string has no writer to kill.
            seal=$(codesign -dv "$1" 2>&1 || true)
            grep -q "^Sealed Resources" <<<"$seal" || {
              echo "::error::$1 has no sealed resources -- signing regressed to linker-signed"
              exit 1
            }
          }

          for configuration in Release Debug; do
            xcodebuild -project Hyperspace.xcodeproj -target Hyperspace -configuration "$configuration" build
            verify "build/$configuration/Hyperspace.saver"
          done
